name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: abstractobserver
    steps:
      - name: Check out AbstractObserver
        uses: actions/checkout@v4
        with:
          path: abstractobserver

      # AbstractUIC is checked out NEXT TO this repo (workspace/abstractuic):
      # vite.config.ts and vitest.config.cjs alias the monitor-* packages to
      # ../abstractuic/*/src, so the build bundles them from this checkout.
      # `@abstractframework/ui-kit`, `panel-chat` and `app-server` are registry
      # dependencies (package.json), installed by `npm ci`.
      # Pinned to the AbstractUIC release this Observer is built against
      # (v0.5.2: ui-kit 0.5.1, panel-chat 0.2.4, monitor-active-memory 0.2.2) —
      # never the default branch, so a later kit change cannot alter this
      # build. Bump it with that release; ci.yml and release.yml pin the same.
      - name: Check out AbstractUIC
        uses: actions/checkout@v4
        with:
          repository: lpalbou/AbstractUIC
          ref: v0.5.2
          path: abstractuic

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: abstractobserver/package-lock.json

      - name: Install dependencies
        run: npm ci

      # src/ui/space_dom.test.tsx lays the phone screens out in Chromium
      # (one page scroll, DESIGN §12): the test needs the Playwright browser.
      - name: Install Chromium for the layout tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)." >&2
            exit 1
          fi

      - name: Publish package
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi

  github-release:
    name: GitHub release page
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The release page carries this version's CHANGELOG section, like the
      # framework's other packages (operator request 2026-10-01). A page that
      # already exists is left as it is.
      - name: Create the release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no [$VERSION] section" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "AbstractObserver $VERSION" --notes-file notes.md --verify-tag
          fi
