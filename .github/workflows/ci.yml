name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abstractobserver
    steps:
      - name: Check out AbstractObserver
        uses: actions/checkout@v4
        with:
          path: abstractobserver

      # AbstractUIC is checked out NEXT TO this repo (workspace/abstractuic):
      # vite.config.ts and vitest.config.cjs alias the shared UI packages
      # (ui-kit, panel-chat, monitors) to ../abstractuic/*/src, so the build
      # bundles them from this checkout. `@abstractframework/app-server` is a
      # registry dependency (package.json), installed by `npm ci`.
      # Pinned to the AbstractUIC release this Observer is built against
      # (ui-kit 0.1.16: controlHint / CONTROL_HINTS, the shared control hints) —
      # never the default branch, so a later kit change cannot alter this
      # build. Bump it with that release; ci.yml and release.yml pin the same.
      - name: Check out AbstractUIC
        uses: actions/checkout@v4
        with:
          repository: lpalbou/AbstractUIC
          ref: v0.1.16
          path: abstractuic

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: abstractobserver/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run
